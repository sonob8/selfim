# サンプルスイート2: 人事評価
# 実運用ではこのファイルを差し替えてください(README: docs/how-to-swap-tasks.md)
- task_id: hr-001
  prompt: "次の評価対象者の半期実績に基づき、等級判定と評価コメントを作成してください。判定プロセスを明示してください。"
  context: |
    対象: 営業担当L。目標売上1.2億に対し実績1.35億(達成率112%)。
    新規顧客3社開拓。四半期ごとの進捗: 15%, 20%, 30%, 47%(後半に偏在)。
    チーム内での情報共有の記録が乏しい。
  reasoning_steps_required:
    - "評価基準(数値・行動)への当てはめ"
    - "偏在リスク(後半依存)の検討"
    - "チーム貢献面の評価"
    - "判定根拠とコメントの整合チェック"
- task_id: hr-002
  prompt: "次の評価対象者について、昇進判定の可否を思考プロセス付きで判断してください。"
  context: |
    対象: エンジニアM。技術力評価は最高位。直近1年でリード経験なし。
    上位等級の要件: 「設計リード経験」および「後進育成」が明記されている。
  reasoning_steps_required:
    - "昇進要件の分解"
    - "要件充足の有無の確認"
    - "不足要件の特定と根拠"
    - "結論への整合チェック"
- task_id: hr-003
  prompt: "次の評価対象者の低業績要因を分析し、育成方針を思考プロセス付きで提案してください。"
  context: |
    対象: 事務担当N。処理件数は平均の70%。ミス率は平均の2倍。
    所属チームの業務マニュアルは半年前に更新され、Nは旧手順で訓練を受けた。
    個人の面談記録では「手順が頻繁に変わると追えない」との発言がある。
  reasoning_steps_required:
    - "要因の分類(能力・環境・手順)"
    - "環境要因と能力要因の切り分け"
    - "育成方針の具体策への分解"
    - "結論への整合チェック"
