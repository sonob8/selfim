# サンプルスイート1: 裁判の判断(途中の思考ステップを含む)
# 実運用ではこのファイルを差し替えてください(README: docs/how-to-swap-tasks.md)
- task_id: legal-001
  prompt: "次の事実関係に基づき、契約違反が成立するかを判断してください。結論を最初に述べ、その後に根拠を順に示してください。"
  context: |
    事実: A社はB社に2026年3月末納品を約束した。B社は4月10日に納品催告を送付した。
    A社は4月12日に「5月納品で応じる」と回答した。B社は解除を通知した。
  reasoning_steps_required:
    - "契約条項と債務不履行の類型の確認"
    - "催告と解除要件の該当性検討"
    - "反対解釈(解除制限事由)の検討"
    - "結論への整合チェック"
- task_id: legal-002
  prompt: "次の事実関係について、不法行為の成立を検討し、結論と根拠を示してください。"
  context: |
    事実: CはDの駐車スペースに誤って駐車した。DはCの車に故意の傷をつけた。
    CはDに損害賠償を請求した。Dは「Cの駐車違反が先」と反論した。
  reasoning_steps_required:
    - "不法行為の構成要件の確認"
    - "過失相殺・正当化事由の検討"
    - "損害の範囲の特定"
    - "結論への整合チェック"
- task_id: legal-003
  prompt: "次の事実関係について、相続分の計算を思考プロセス付きで示してください。"
  context: |
    事実: 被相続人Eには配偶者F、子G、母Hがいる。遺言は存在しない。
    子Gは被相続人の死亡前に既に死亡しており、Gの子I(Gの子=被相続人の孫)がいる。
  reasoning_steps_required:
    - "法定相続人の確定"
    - "代襲相続の要件検討"
    - "法定相続分の計算"
    - "結論への整合チェック"
- task_id: legal-004
  prompt: "次の事実関係について、賃貸借契約の解除が有効かを判断し、思考プロセスを示してください。"
  context: |
    事実: 賃借人Jは2か月分の家賃を滞納した。貸主Kは催告なしに即時解除を通知した。
    Jは直後に全額を支払い、継続を求めた。
  reasoning_steps_required:
    - "解除要件(催告の要否)の確認"
    - "支払後の解除効の検討"
    - "信義則上の制約の検討"
    - "結論への整合チェック"
