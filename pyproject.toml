[project]
name = "selfim"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "docker>=7.1.0",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.4",
    "strands-agents>=1.65.0",
]

[dependency-groups]
dev = [
    "moto>=5.2.5",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 既定では遅いdocker E2Eを除外する(明示的に実行するには -m docker_e2e)
addopts = "-m 'not docker_e2e'"
markers = [
    "docker: Docker デーモンが必要なテスト(実コンテナ起動を含む)",
    "docker_e2e: 遅いdocker E2E(イメージビルドを含む全体ループ)",
]
